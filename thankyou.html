<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Saloni Nakat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#08111f;

overflow:hidden;

position:relative;

}

/* Background Glow */

body::before{

content:"";

position:absolute;

width:450px;
height:450px;

background:#6d5dfc;

filter:blur(180px);

top:-150px;
left:-150px;

opacity:.45;

}

body::after{

content:"";

position:absolute;

width:450px;
height:450px;

background:#3fa9ff;

filter:blur(180px);

bottom:-150px;
right:-150px;

opacity:.35;

}

.card{

position:relative;

z-index:5;

width:90%;
max-width:700px;

padding:60px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.12);

border-radius:25px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.45);

}

.check{

width:120px;
height:120px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#6d5dfc,#3fa9ff);

display:flex;
justify-content:center;
align-items:center;

font-size:60px;

animation:pop .7s ease;

}

@keyframes pop{

0%{

transform:scale(.3);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

h1{

margin-top:30px;

font-size:42px;

color:white;

}

p{

margin-top:20px;

font-size:18px;

line-height:1.8;

color:#c7d2fe;

}

.count{

margin-top:35px;

color:#94a3b8;

font-size:15px;

}

.btn{

display:inline-block;

margin-top:35px;

padding:15px 35px;

text-decoration:none;

border-radius:10px;

background:linear-gradient(135deg,#6d5dfc,#3fa9ff);

color:white;

font-weight:600;

transition:.3s;

}

.btn:hover{

transform:translateY(-4px);

}

</style>

</head>

<body>

<div class="card">

<div class="check">

✔

</div>

<h1>Message Sent Successfully!</h1>

<p>

Thank you for reaching out.

<br><br>

Your message has been received successfully.

I appreciate your interest and will get back to you as soon as possible.

</p>

<div class="count">

Redirecting to Portfolio in

<span id="seconds">5</span>

seconds...

</div>

<a href="index.html" class="btn">

Back to Portfolio

</a>

</div>

<script>

let sec=5;

const countdown=document.getElementById("seconds");

setInterval(()=>{

sec--;

countdown.textContent=sec;

if(sec==0){

window.location.href="index.html";

}

},1000);

</script>

</body>

</html>
